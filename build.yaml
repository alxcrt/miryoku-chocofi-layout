# Dongle mode: Prospector (XIAO BLE) is central, both halves are peripherals.
# No dongle: flash corne_left_standalone on the left half (right half firmware is the same).
# When switching modes, flash settings_reset on every part first, then the real firmware.
include:
  - board: xiao_ble//zmk
    shield: corne_dongle prospector_adapter

  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_dongle

  - board: nice_nano//zmk
    shield: corne_right nice_view_adapter nice_view
    artifact-name: corne_right

  - board: nice_nano//zmk
    shield: corne_left nice_view_adapter nice_view
    artifact-name: corne_left_standalone

  - board: nice_nano//zmk
    shield: settings_reset

  - board: xiao_ble//zmk
    shield: settings_reset
