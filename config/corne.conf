# Shared by every part (dongle + both halves)
CONFIG_ZMK_KEYBOARD_NAME="🌽 Corne"
CONFIG_ZMK_POINTING=y

# Max radio power: stronger dongle <-> halves link, negligible battery cost per ZMK docs
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep after 15 min idle, any key wakes. ZMK never sleeps on USB power, so the dongle stays up.
# Tune with CONFIG_ZMK_IDLE_SLEEP_TIMEOUT (ms).
CONFIG_ZMK_SLEEP=y
