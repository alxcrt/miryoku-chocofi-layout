# Shared by every part (dongle + both halves)
CONFIG_ZMK_KEYBOARD_NAME="🌽 Corne"
CONFIG_ZMK_POINTING=y

# Max radio power: stronger dongle <-> halves link, negligible battery cost per ZMK docs
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep after 15 min idle, any key wakes. ZMK never sleeps on USB power, so the dongle stays up.
# Tune with CONFIG_ZMK_IDLE_SLEEP_TIMEOUT (ms).
CONFIG_ZMK_SLEEP=y

# Key press latency. ZMK default is 5 ms press / 5 ms release. Press detection is eager
# (reported immediately, then further changes ignored for the debounce window), so 1 ms
# still absorbs short noise spikes - this is ZMK's own recommended value, not 0.
# Symptom of too low: one press types two characters. Put it back to 5 if that happens.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
