# Shared by every part (dongle + both halves)
CONFIG_ZMK_KEYBOARD_NAME="🌽 Corne"
CONFIG_ZMK_POINTING=y

# Max radio power: stronger dongle <-> halves link, negligible battery cost per ZMK docs
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Displays idle after 30 seconds; battery-powered halves sleep after 15 minutes.
# A key wakes a half, but BLE reconnection can take a few seconds. USB power prevents sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# These builds use nice!view / Prospector displays, not an SSD1306 OLED.
CONFIG_SSD1306=n

# ZMK uses deferred debounce: 1 ms press filtering / 5 ms release filtering.
# The 1 ms press window reduces latency versus the 5 ms default while filtering
# brief noise spikes. This is not true eager debounce (immediate reporting).
# Symptom of too low: one press types two characters. Put it back to 5 if that happens.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
